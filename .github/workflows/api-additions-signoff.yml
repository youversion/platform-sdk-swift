name: API Additions Signoff

# Unprivileged half of the human signoff gate for *additive* public API
# changes. Design and decisions: docs/shaping-api-additions-signoff.md.
#
# This workflow runs on every PR — including external forks, which MUST NOT
# be able to bypass the gate (shaping-doc decision, 2026-08-14). Fork PR
# tokens are read-only, so this job never posts comments or statuses; it only
# builds the API diff and uploads it as an artifact. The privileged
# `workflow_run` half in api-additions-signoff-gate.yml (which always runs
# the trusted code from the default branch) does all the writing.
#
# Note for branch protection: the `paths` filter means docs-only PRs never
# run this workflow, so the `api-additions-signoff` commit status is absent
# on them. Keep that in mind before making the status a required check.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Sources/**'
      - 'Package.swift'

permissions:
  contents: read

concurrency:
  group: api-additions-signoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  XCODE_VERSION: latest-stable

jobs:
  # Builds the API surface at the merge-base and at head, diffs them, and
  # uploads the result. No write operations — safe to run on untrusted fork
  # code.
  detect:
    name: Detect public API additions
    runs-on: macos-26
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Written before the build so the gate workflow can fail closed with
      # the right head SHA even when the build itself dies.
      - name: Record PR metadata for the gate workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          mkdir -p "$RUNNER_TEMP/detect"
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "pr_author=$PR_AUTHOR"
          } > "$RUNNER_TEMP/detect/meta.txt"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Dump public API at merge-base and head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Diff against the merge-base, not the base branch tip, so additions
          # merged to main after this PR branched don't leak into its list.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Merge base: $MERGE_BASE"

          git checkout --quiet "$MERGE_BASE"
          # Overlay head's scripts so tooling changes in this PR (including
          # the dump mode itself) apply to the merge-base build too.
          git checkout --quiet "$HEAD_SHA" -- scripts
          scripts/check-api-stability.sh dump "$RUNNER_TEMP/dump-base"

          git checkout --quiet --force "$HEAD_SHA"
          scripts/check-api-stability.sh dump "$RUNNER_TEMP/dump-head"

      - name: Report additions in this PR
        run: |
          set -e
          scripts/check-api-stability.sh report \
            "$RUNNER_TEMP/dump-base" "$RUNNER_TEMP/dump-head" \
            --count-file "$RUNNER_TEMP/count.txt" \
            | tee "$RUNNER_TEMP/detect/report.txt"
          COUNT=$(tr -d '[:space:]' < "$RUNNER_TEMP/count.txt")
          # Short hash of the report text: embedded in the PR comment and
          # required in the acknowledgment reply, so an acknowledgment is
          # automatically invalidated when the addition set changes.
          HASH=$(shasum -a 256 "$RUNNER_TEMP/detect/report.txt" | cut -c1-12)
          {
            echo "count=$COUNT"
            echo "hash=$HASH"
          } >> "$RUNNER_TEMP/detect/meta.txt"

      # if: always() so the gate can fail closed using the metadata even when
      # the build or digester step above failed.
      - name: Upload detection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-additions-detect
          path: ${{ runner.temp }}/detect/
          if-no-files-found: error
