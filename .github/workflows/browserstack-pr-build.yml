name: BrowserStack App Live PR Build

# First increment of YPE-3011: when an approved automation-repository
# collaborator opens or updates a same-repository PR, dispatch the existing SDK
# build for the PR's exact head SHA and upload the resulting .ipa to
# BrowserStack App Live. Test automation and App Automate execution are
# deliberately out of scope.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  AUTOMATION_REPO: youversion/platform_swift_sdk_automation
  WORKFLOW_FILE: build-sdk-app.yml

concurrency:
  group: app-live-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  app-live-build:
    name: Build SampleApp for App Live
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Fork pull_request workflows cannot receive the cross-repository secret.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Verify PR author is an approved automation collaborator
        id: authorization
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          PERMISSION=$(gh api \
            "repos/$AUTOMATION_REPO/collaborators/$PR_AUTHOR/permission" \
            --jq '.permission')

          case "$PERMISSION" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "PR author '$PR_AUTHOR' is approved with '$PERMISSION' access to $AUTOMATION_REPO."
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::PR author '$PR_AUTHOR' has '$PERMISSION' access to $AUTOMATION_REPO; App Live build skipped."
              ;;
          esac

      - name: Define remote build
        if: steps.authorization.outputs.allowed == 'true'
        id: build
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SHA7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)

          TICKET=$(printf '%s' "$HEAD_REF" | grep -Eio 'YPE-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -n "$TICKET" ]; then
            BUILD_KEY="$TICKET"
          else
            BRANCH_KEY=$(printf '%s' "$HEAD_REF" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' |
              cut -c1-40)
            BUILD_KEY=${BRANCH_KEY:-pr-$PR_NUMBER}
          fi

          BUILD_PREFIX="swift-$BUILD_KEY-"
          PRIOR_BUILDS=$(gh api \
            "repos/$AUTOMATION_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=100" \
            --jq "[.workflow_runs[] | select(.display_title | startswith(\"$BUILD_PREFIX\"))] | length")
          BUILD_NUMBER=$((PRIOR_BUILDS + 1))
          BUILD_NAME="$BUILD_PREFIX$BUILD_NUMBER"

          {
            echo "name=$BUILD_NAME"
            echo "key=$BUILD_KEY"
            echo "number=$BUILD_NUMBER"
            echo "sha7=$SHA7"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch exact PR head to App Live
        if: steps.authorization.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sdk_ref "$HEAD_SHA" \
            --arg build_name "$BUILD_NAME" \
            '{
              ref: "main",
              inputs: {
                sdk_ref: $sdk_ref,
                target: "app-live",
                build_name: $build_name
              }
            }' |
            gh api \
              --method POST \
              "repos/$AUTOMATION_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
              --input -
          echo "Dispatched '$BUILD_NAME' for exact SDK SHA $HEAD_SHA."

      - name: Locate remote build
        if: steps.authorization.outputs.allowed == 'true'
        id: remote
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 20); do
            RUN_ID=$(gh api \
              "repos/$AUTOMATION_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.display_title | startswith(\"$BUILD_NAME \")) | .id" |
              head -1)
            [ -n "$RUN_ID" ] && break
            sleep 3
          done

          test -n "$RUN_ID" || {
            echo "::error::Dispatched '$BUILD_NAME' but could not locate its automation run."
            exit 1
          }

          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$AUTOMATION_REPO/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for App Live upload
        if: steps.authorization.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          RUN_ID: ${{ steps.remote.outputs.id }}
        run: |
          set -euo pipefail
          while :; do
            STATUS=$(gh api "repos/$AUTOMATION_REPO/actions/runs/$RUN_ID" --jq '.status')
            [ "$STATUS" = "completed" ] && break
            echo "Remote build $RUN_ID: $STATUS"
            sleep 30
          done

          CONCLUSION=$(gh api "repos/$AUTOMATION_REPO/actions/runs/$RUN_ID" --jq '.conclusion')
          echo "Remote build $RUN_ID concluded: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::SampleApp build or App Live upload failed ($CONCLUSION)."
            exit 1
          fi

      - name: Read App Live id
        if: steps.authorization.outputs.allowed == 'true'
        id: app_live
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          RUN_ID: ${{ steps.remote.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$AUTOMATION_REPO/actions/runs/$RUN_ID/logs" > /tmp/remote-logs.zip
          unzip -oq /tmp/remote-logs.zip -d /tmp/remote-logs
          APP_ID=$(grep -rhoE 'Uploaded to App Live: bs://[A-Za-z0-9]+' /tmp/remote-logs |
            head -1 | grep -oE 'bs://[A-Za-z0-9]+' || true)
          test -n "$APP_ID" || {
            echo "::error::Remote build succeeded but its App Live bs:// id was not found."
            exit 1
          }
          echo "id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        env:
          ALLOWED: ${{ steps.authorization.outputs.allowed }}
          APP_LIVE_ID: ${{ steps.app_live.outputs.id }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ steps.remote.outputs.url }}
        run: |
          {
            echo "## BrowserStack App Live build"
            echo ""
            if [ "$ALLOWED" != "true" ]; then
              echo "No build was dispatched because PR author $PR_AUTHOR is not an approved collaborator on $AUTOMATION_REPO."
              exit 0
            fi
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| PR / SHA | #$PR_NUMBER @ $HEAD_SHA |"
            echo "| Build name | $BUILD_NAME |"
            echo "| Automation run | $RUN_URL |"
            echo "| App Live id | $APP_LIVE_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
